<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cactus Ranch Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CLICKABLE BANNER TO RETURN HOME -->
  <header id="top-banner">
    <a href="index.html" class="banner-link">
      <img src="images/cactus-ranch-banner.jpg" alt="Cactus Ranch Banner" class="banner-img">
    </a>
  </header>

  <main id="gallery-wrapper">

    <h1 class="gallery-title">Cactus Ranch Gallery</h1>

    <section class="gallery-grid">

      <!-- Replace these with your actual artwork images -->
      <div class="gallery-item">
        <img src="images/art1.jpg" alt="Artwork 1">
      </div>

      <div class="gallery-item">
        <img src="images/art2.jpg" alt="Artwork 2">
      </div>

      <div class="gallery-item">
        <img src="images/art3.jpg" alt="Artwork 3">
      </div>

      <div class="gallery-item">
        <img src="images/art4.jpg" alt="Artwork 4">
      </div>

    </section>

  </main>

</body>
</html>
