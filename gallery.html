<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cactus Ranch Gallery</title>

<link rel="stylesheet" href="styles.css">

<style>
    body {
        margin: 0;
        background-color: #2b1a12;
        font-family: Georgia, serif;
        color: #f8e4c0;
    }

    .header {
        text-align: center;
        padding: 30px 20px;
    }

    .header h1 {
        font-size: 48px;
        margin-bottom: 10px;
        color: #ffddaa;
    }

    .header p {
        font-size: 20px;
        max-width: 800px;
        margin: auto;
        line-height: 1.5;
    }

    h2 {
        text-align: center;
        margin-top: 40px;
        font-size: 32px;
        color: #ffddaa;
    }

    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 25px;
        padding: 40px;
        max-width: 1400px;
        margin: auto;
    }

    .gallery-item {
        background: #3a2412;
        padding: 12px;
        border: 2px solid #5a3a1a;
        box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        border-radius: 6px;
        text-align: center;
    }

    .gallery-item img {
        width: 100%;
        height: auto;
        border-radius: 4px;
        border: 2px solid #2b1a12;
    }

    .gallery-item h3 {
        margin-top: 12px;
        font-size: 22px;
        color: #ffddaa;
    }

    .back-btn {
        display: block;
        width: fit-content;
        margin: 40px auto;
        background: #5a3a1a;
        padding: 14px 28px;
        color: #f8e4c0;
        text-decoration: none;
        border: 2px solid #3a2412;
        font-size: 20px;
        border-radius: 6px;
        transition: transform 0.2s;
    }

    .back-btn:hover {
        transform: scale(1.07);
    }
</style>

</head>
<body>

<div class="header">
    <h1>Cactus Ranch Art Gallery</h1>
    <p>
        Explore the frontier through original Western artwork — mustangs, sunsets, ranch life,
        storms, legends, and the spirit of the open range.
    </p>
</div>

<!-- CATEGORY: MUSTANGS -->
<h2>Mustangs</h2>
<div class="gallery-grid">
    <div class="gallery-item">
        <img src="mustang-sunset.jpg" alt="Mustang Sunset">
        <h3>Mustang Sunset</h3>
    </div>
</div>

<!-- CATEGORY: RANCH LIFE -->
<h2>Ranch Life</h2>
<div class="gallery-grid">
    <div class="gallery-item">
        <img src="ranch-gate.jpg" alt="Ranch Gate">
        <h3>Ranch Gate</h3>
    </div>

    <div class="gallery-item">
        <img src="campfire-night.jpg" alt="Campfire Night">
        <h3>Campfire Night</h3>
    </div>
</div>

<!-- CATEGORY: TRAILS -->
<h2>Trails</h2>
<div class="gallery-grid">
