<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cactus Ranch Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- GALLERY BANNER -->
  <header id="top-banner">
    <a href="index.html" class="banner-link">
      <img src="images/cactus-ranch-trading-post.jpg" alt="Cactus Ranch Gallery Banner" class="banner-img">
    </a>
  </header>

  <main id="gallery-wrapper">

    <h1 class="gallery-title">Cactus Ranch Gallery</h1>

    <section class="gallery-grid">

      <!-- Example gallery items — replace with your real art -->
      <div class="gallery-item">
        <img src="images/daniel-mckeegan-mustang-sunset.jpg" alt="Mustang Sunset">
        <p class="gallery-caption">Mustang Sunset</p>
      </div>

      <div class="gallery-item">
        <img src="images/Sundown Companion.jpg" alt="Sundown Companion">
        <p class="gallery-caption">Sundown Companion</p>
      </div>

      <div class="gallery-item">
        <img src="images/Touch of the Wild.jpg" alt="Touch of the Wild">
        <p class="gallery-caption">Touch of the Wild</p>
      </div>

      <div class="gallery-item">
        <img src="images/Mistwalker’s Companion.jpg" alt="Mistwalker’s Companion">
        <p class="gallery-caption">Mistwalker’s Companion</p>
      </div>

    </section>

  </main>

</body>
</html>
