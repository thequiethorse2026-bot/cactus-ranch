<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cactus Ranch Gallery</title>

<link rel="stylesheet" href="styles.css">

<style>
    body {
        margin: 0;
        background-color: #2b1a12;
        font-family: Georgia, serif;
        color: #f8e4c0;
    }

    /* HERO IMAGE */
    .hero {
        position: relative;
        width: 100%;
        overflow: hidden;
    }

    .hero img {
        width: 100%;
        height: auto;
        display: block;
    }

    /* LIVE BUTTON BAR */
    .nav-buttons {
        position: absolute;
        top: 40px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 40px;
    }

    .nav-btn {
        background: #5a3a1a;
        color: #f8e4c0;
        padding: 12px 24px;
        text-decoration: none;
        border: 2px solid #3a2412;
        box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        transition: transform 0.2s, background 0.2s;
        font-size: 20px;
    }

    .nav-btn:hover {
        transform: scale(1.08);
        background: #704a26;
    }

    /* WELCOME TEXT */
    .welcome {
        text-align: center;
        padding: 40px 20px;
        max-width: 900px;
        margin: auto;
    }

    .welcome h1 {
        font-size: 48px;
        margin-bottom: 10px;
        color: #ffddaa;
    }

    .welcome p {
        font-size: 22px;
        line-height: 1.5;
    }

    /* ENTER GALLERY BUTTON */
    .enter-btn {
        display: inline-block;
        margin-top: 20px;
        background: #3d6b3d;
        padding: 14px 28px;
        color: #fff7e0;
        text-decoration: none;
        font-size: 22px;
        border-radius: 6px;
        border: 2px solid #2a4a2a;
        transition: transform 0.2s;
    }

    .enter-btn:hover {
        transform: scale(1.07);
    }
</style>

</head>
<body>

<!-- HERO IMAGE WITH LIVE BUTTONS -->
<div class="hero">
    <img src="home.jpg" alt="Cactus Ranch Homepage">

    <div class="nav-buttons">
        <a href="gallery.html" class="nav-btn">Gallery</a>
        <a href="books.html" class="nav-btn">Books</a>
        <a href="store.html" class="nav-btn">Store</a>
        <a href="contact.html" class="nav-btn">Contact</a>
    </div>
</div>

<!-- WELCOME SECTION -->
<div class="welcome">
    <h1>Welcome to the Cactus Ranch</h1>
    <p>
        Step through the DM Ranch gates and into a world of Western stories, frontier art,
        and the spirit of the open range. Explore the gallery, read the tales, and ride along
        with the legends of the West.
    </p>

    <a href="gallery.html" class="enter-btn">🌵 Enter the Gallery</a>
</div>

</body>
</html>
