<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cactus Ranch Gallery</title>
    <link rel="stylesheet" href="styles.css?v=4">
</head>

<body>

    <!-- RANCH GATE HEADER -->
    <header class="ranch-gate">

        <!-- LEFT POST -->
        <div class="gate-post left-post"></div>

        <!-- TOP BEAM WITH HANGING NAV -->
        <div class="gate-beam">
            <nav class="hanging-nav">
                <a href="gallery.html" class="hang-plank">Gallery</a>
                <a href="books.html" class="hang-plank">Books</a>
                <a href="sale.html" class="hang-plank">Store</a>
                <a href="contact.html" class="hang-plank">Contact</a>
            </nav>
        </div>

        <!-- RIGHT POST -->
        <div class="gate-post right-post"></div>

    </header>

    <!-- HERO SECTION WITH GATE IMAGE -->
    <section class="hero" style="
        background-image: url('images/dm-ranch-entrance.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 70vh;
        border-bottom: 4px solid #5a3b1e;
    ">
    </section>

    <!-- WELCOME SECTION -->
    <section class="welcome">
        <h2>Welcome to the Cactus Ranch</h2>
        <p>
            Step through the DM Ranch gates and into a world of Western stories, rugged landscapes,
            and frontier artwork. Every piece here is crafted with grit, heart, and the spirit of the open range.
        </p>
    </section>

    <!-- CTA BUTTON -->
    <section class="cta-section">
        <a href="gallery.html" class="cta-button">
            <span class="icon">🌵</span> Enter the Gallery
        </a>
    </section>

</body>
</html>
