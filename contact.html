<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact – Cactus Ranch</title>

<link rel="stylesheet" href="styles.css">

<style>
    body {
        margin: 0;
        background-color: #2b1a12;
        font-family: Georgia, serif;
        color: #f8e4c0;
    }

    /* HEADER */
    .header {
        text-align: center;
        padding: 40px 20px;
    }

    .header h1 {
        font-size: 48px;
        margin-bottom: 10px;
        color: #ffddaa;
    }

    .header p {
        font-size: 20px;
        max-width: 800px;
        margin: auto;
        line-height: 1.5;
    }

    /* CONTACT BOX */
    .contact-box {
        max-width: 800px;
        margin: 40px auto;
        background: #3a2412;
        padding: 30px;
        border: 2px solid #5a3a1a;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }

    .contact-box h2 {
        margin-top: 0;
        color: #ffddaa;
        font-size: 28px;
    }

    .contact-box p {
        font-size: 20px;
        line-height: 1.5;
    }

    .email {
        font-size: 24px;
        font-weight: bold;
        margin-top: 10px;
        color: #ffddaa;
    }

    /* CONTACT FORM */
    form {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    label {
        font-size: 18px;
    }

    input, textarea {
        padding: 12px;
        font-size: 18px;
        border: 2px solid #5a3a1a;
        border-radius: 6px;
        background: #2b1a12;
        color: #f8e4c0;
    }

    button {
        background: #3d6b3d;
        padding: 14px;
        color: #fff7e0;
        font-size: 20px;
        border: 2px solid #2a4a2a;
        border-radius: 6px;
        cursor: pointer;
        transition: transform 0.2s;
    }

    button:hover {
        transform: scale(1.07);
    }

    /* BACK BUTTON */
    .back-btn {
        display: block;
        width: fit-content;
        margin: 40px auto;
        background: #5a3a1a;
        padding: 14px 28px;
        color: #f8e4c0;
        text-decoration: none;
        border: 2px solid #3a2412;
        font-size: 20px;
        border-radius: 6px;
        transition: transform 0.2s;
    }

    .back-btn:hover {
        transform: scale(1.07);
    }
</style>

</head>
<body>

<div class="header">
    <h1>Contact the Cactus Ranch</h1>
    <p>
        Got a question about artwork, books, orders, or the DM Ranch?  
        Send a message anytime — I’ll get back to you as soon as I’m off the trail.
    </p>
</div>

<div class="contact-box">
    <h2>Email</h2>
    <p>You can reach me directly at:</p>
    <p class="email">thequiethorse2026@gmail.com</p>

    <form>
        <label>Your Name</label>
        <input type="text" placeholder="Your name">

        <label>Your Email</label>
        <input type="email" placeholder="your-email@example.com">

        <label>Your Message</label>
        <textarea rows="6" placeholder="Write your message here..."></textarea>

        <button type="submit">Send Message</button>
    </form>
</div>

<a href="index.html" class="back-btn">⬅ Return to Home</a>

</body>
</html>
