<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Cactus Ranch</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CLICKABLE BANNER -->
  <header id="top-banner">
    <a href="index.html" class="banner-link">
      <img src="images/cactus-ranch-trading-post.jpg" alt="Cactus Ranch Banner" class="banner-img">
    </a>
  </header>

  <main id="contact-wrapper">

    <h1 class="contact-title">Contact</h1>

    <section id="contact-info">
      <p>
        If you’ve got questions about artwork, prints, books, or anything else from the ranch, you can reach me anytime at:
      </p>

      <p class="contact-email"><strong>thequiethorse2026@gmail.com</strong></p>

      <p>
        I usually reply within <strong>24–48 hours</strong>. If I’m out sketching or on the trail, it might take a little longer — but I always answer.
      </p>
    </section>

    <section id="contact-form-section">
      <h2 class="form-title">Send a Message</h2>

      <form id="contact-form">
        <label>Your Name</label>
        <input type="text" placeholder="Your name">

        <label>Your Email</label>
        <input type="email" placeholder="your-email@example.com">

        <label>Your Message</label>
        <textarea rows="6" placeholder="Write your message here..."></textarea>

        <button type="submit" class="form-button">Send Message</button>
      </form>
    </section>

  </main>

</body>
</html>
