<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cactus Ranch Gallery</title>

    <!-- Main site styles -->
    <link rel="stylesheet" href="styles.css?v=4">

    <!-- Gallery-specific styles -->
    <link rel="stylesheet" href="gallery.css?v=1">
</head>

<body>

    <!-- RANCH GATE HEADER -->
    <header class="ranch-gate">

        <!-- LEFT POST -->
        <div class="gate-post left-post"></div>

        <!-- TOP BEAM WITH HANGING NAV -->
        <div class="gate-beam">
            <nav class="hanging-nav">
                <a href="index.html" class="hang-plank">Home</a>
                <a href="books.html" class="hang-plank">Books</a>
                <a href="sale.html" class="hang-plank">Store</a>
                <a href="contact.html" class="hang-plank">Contact</a>
            </nav>
        </div>

        <!-- RIGHT POST -->
        <div class="gate-post right-post"></div>

    </header>

    <!-- PAGE TITLE -->
    <h1 class="gallery-title">Cactus Ranch Art Gallery</h1>

    <!-- FILTER BUTTONS -->
    <div class="filter-buttons">
        <button data-filter="all">All</button>
        <button data-filter="horses">Horses</button>
        <button data-filter="landscapes">Landscapes</button>
        <button data-filter="portraits">Portraits</button>
    </div>

    <!-- GALLERY GRID -->
    <div class="gallery-grid">

        <!-- ITEM 1 -->
        <div class="gallery-item horses">
            <img src="images/mustang-sunset.jpg" alt="Mustang Sunset">
            <h3>Mustang Sunset</h3>
        </div>

        <!-- ITEM 2 -->
        <div class="gallery-item landscapes">
            <img src="images/desert-ridge.jpg" alt="Desert Ridge">
            <h3>Desert Ridge</h3>
        </div>

        <!-- ITEM 3 -->
        <div class="gallery-item portraits">
            <img src="images/cowboy-portrait.jpg" alt="Cowboy Portrait">
            <h3>Cowboy Portrait</h3>
        </div>

        <!-- ITEM 4 -->
        <div class="gallery-item horses">
            <img src="images/wild-stallion.jpg" alt="Wild Stallion">
            <h3>Wild Stallion</h3>
        </div>

    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <!-- GALLERY SCRIPT -->
    <script>
        // Filtering
        const buttons = document.querySelectorAll(".filter-buttons button");
        const items = document.querySelectorAll(".gallery-item");

        buttons.forEach(btn => {
            btn.addEventListener("click", () => {
                const filter = btn.getAttribute("data-filter");

                items.forEach(item => {
                    if (filter === "all" || item.classList.contains(filter)) {
                        item.classList.remove("hidden");
                    } else {
                        item.classList.add("hidden");
                    }
                });
            });
        });

        // Lightbox
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const closeBtn = document.getElementById("lightbox-close");

        items.forEach(item => {
            item.addEventListener("click", () => {
                const imgSrc = item.querySelector("img").src;
                lightboxImg.src = imgSrc;
                lightbox.classList.add("active");
            });
        });

        closeBtn.addEventListener("click", () => {
            lightbox.classList.remove("active");
        });
    </script>

</body>
</html>
