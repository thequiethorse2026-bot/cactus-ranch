<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>McKegan Trading Post</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="store-body">

  <!-- Store Room Wrapper -->
  <div class="store-room">

    <!-- ============================
         WOODEN HEADER SIGN
    ============================= -->
    <header class="store-header">
      <div class="header-sign">
        <h1>McKegan Trading Post</h1>
        <p class="header-subtitle">Western Art • Stories • Prints</p>
      </div>
    </header>

    <!-- ============================
         HANGING BUTTON BOARD
    ============================= -->
    <section class="button-board">
      <h2 class="board-title">Browse the Trading Post</h2>

      <!-- Top Row -->
      <div class="button-row">
        <a href="#silhouettes" class="wood-button">
          <span class="button-icon">🐎</span>
          <span class="button-text">Western Silhouette Series</span>
        </a>

        <a href="#neon" class="wood-button">
          <span class="button-icon">⚡</span>
          <span class="button-text">Neon Western Prints</span>
        </a>

        <a href="#patterns" class="wood-button">
          <span class="button-icon">◆</span>
          <span class="button-text">Western Pattern Prints</span>
        </a>

        <a href="#minimalist" class="wood-button">
          <span class="button-icon">🌵</span>
          <span class="button-text">Minimalist Western Art</span>
        </a>
      </div>

      <!-- Bottom Row -->
      <div class="button-row">
        <a href="#abstract-mustang" class="wood-button">
          <span class="button-icon">🔥</span>
          <span class="button-text">Abstract Mustang Series</span>
        </a>

        <a href="#vintage-posters" class="wood-button">
          <span class="button-icon">⭐</span>
          <span class="button-text">Vintage Western Posters</span>
        </a>

        <a href="#wildlife" class="wood-button">
          <span class="button-icon">🦬</span>
          <span class="button-text">Western Wildlife Prints</span>
        </a>
      </div>
    </section>

    <!-- ============================
         FEATURED PRODUCT FRAME
    ============================= -->
    <section class="featured-frame">
      <h2>Featured Print of the Month</h2>

      <div class="featured-inner">
        <!-- Replace with your real image path -->
        <img src="images/daniel-mckegan-mustang-sunset.jpg"
             alt="Mustang Sunset by Daniel McKegan">
      </div>
    </section>

  </div>

</body>
</html>
